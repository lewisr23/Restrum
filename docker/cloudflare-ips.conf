# Cloudflare's edge addresses, so nginx can recover the visitor's real IP.
#
# Every request reaches this origin from Cloudflare, which means $remote_addr
# is a Cloudflare address and the visitor's own appears only in the
# CF-Connecting-IP header. Without this file the gear adviser's per-IP rate
# limit would share a single bucket across the entire internet, and the
# access log would record fifteen networks rather than any visitor.
#
# Trusting CF-Connecting-IP is only safe while Cloudflare is the only thing
# that can reach this origin, which is what the DOCKER-USER rules in
# docs/deploy.md enforce. Open 443 to the world and this becomes a header
# anyone can forge to say whatever they like.
#
# Mounted into /etc/nginx/conf.d/, which the stock nginx.conf includes inside
# its http block, so these apply to every server block in nginx.prod.conf.
#
# Fetched from https://www.cloudflare.com/ips-v4 and /ips-v6 on 2026-09-14.
# Cloudflare changes these rarely; docs/deploy.md says when to bother
# refreshing them.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# A single address rather than a list, so there is no chain to walk back
# through and real_ip_recursive has nothing to do.
real_ip_header CF-Connecting-IP;
