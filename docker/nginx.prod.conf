# The production web tier for restrum.uk.
#
# It differs from docker/nginx.conf, which serves the local stack, in four
# ways that all follow from being on the public internet behind Cloudflare:
#
#   - TLS, using a Cloudflare Origin Certificate rather than Let's Encrypt.
#     That certificate is trusted by Cloudflare and nothing else, which is
#     the point: it makes the origin unusable except through the proxy, and
#     it never needs renewing on a schedule.
#   - the visitor's real IP, recovered in cloudflare-ips.conf.
#   - Reverb on this same port 443. Cloudflare forwards a fixed list of
#     ports and 8081 is not one of them, so the websocket cannot have a port
#     of its own the way it does locally.
#   - forwarded headers set from what this server knows rather than passed
#     through from the client.
#
# docker-compose.prod.yml mounts this over the image's own default.conf, so
# editing it needs a container restart, not a rebuild.

# Anything still arriving on port 80 is redirected. Cloudflare is configured
# to reach the origin over 443, so in practice this only catches direct
# probes and the occasional link written by hand.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://restrum.uk$request_uri;
}

# Requests for any other hostname - almost always a scanner that found the
# bare IP - are dropped without a reply. The certificate is still needed
# here: nginx has to finish the TLS handshake before it can see which host
# was asked for, so a server block with no certificate cannot refuse.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/restrum.uk.pem;
    ssl_certificate_key /etc/nginx/certs/restrum.uk.key;

    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.restrum.uk;

    ssl_certificate     /etc/nginx/certs/restrum.uk.pem;
    ssl_certificate_key /etc/nginx/certs/restrum.uk.key;

    return 301 https://restrum.uk$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name restrum.uk;

    ssl_certificate     /etc/nginx/certs/restrum.uk.pem;
    ssl_certificate_key /etc/nginx/certs/restrum.uk.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # The SPA is the site root and Laravel is mounted underneath it, so
    # index.html and index.php never compete to answer "/".
    root /var/www/frontend;
    index index.html;

    # Matches php.ini's upload_max_filesize/post_max_size and
    # ListingMediaController's largest rule (50MB video), with headroom for
    # multipart overhead. This only has to clear the app's own limits, not
    # define them.
    client_max_body_size 60M;

    # These apply to every response below. add_header does not accumulate
    # across levels - a location declaring one of its own silently drops all
    # of these - which is why the cache rules further down use the expires
    # directive instead, which leaves them in place.
    #
    # HSTS is a one-year promise per browser that saw it. That is safe here
    # because Cloudflare serves the site over https and there is no plain
    # http version to fall back to, but it is worth knowing it cannot be
    # taken back quickly.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # There is deliberately no Content-Security-Policy. Create React App
    # inlines its runtime chunk into index.html, so any policy strict enough
    # to be worth having needs that script's hash, which changes with every
    # build. Generating it at build time is the real fix; a guessed CSP fails
    # by breaking the site rather than by being quietly permissive.

    # Uploaded listing media, straight off the shared storage volume rather
    # than through PHP. Aliased to the volume directly so nginx needs no copy
    # of the Laravel tree and no public/storage symlink.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    # CRA fingerprints everything under /static/, so this is safe to cache
    # hard: a new build produces new filenames rather than new bytes under
    # the old ones.
    location /static/ {
        expires 1y;
        access_log off;
    }

    # The shell that names those files is the opposite case. Cache it and a
    # returning visitor keeps asking for a bundle the last deploy deleted.
    # The SPA fallback below rewrites internally to /index.html, which
    # re-enters location matching, so this covers deep links too.
    location = /index.html {
        expires -1;
    }

    location /api/ {
        try_files $uri @php;
    }

    # Echo posts here to authorize private channel subscriptions.
    location /broadcasting/ {
        try_files $uri @php;
    }

    location = /up {
        try_files $uri @php;
        access_log off;
    }

    # Reverb, sharing this origin's 443 rather than having a port of its own.
    # Cloudflare proxies a fixed set of ports and 8081 is not among them, so
    # the websocket is told apart by path instead: /app/{key} is where the
    # Pusher protocol, which Reverb speaks, puts the socket itself.
    location /app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        # A websocket that is merely quiet is not a websocket that has gone
        # away. The 60s default would drop every conversation that paused to
        # think.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The HTTP half of the same protocol, which is how the server publishes
    # events into a channel.
    location /apps/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Anything else is a client-side route: hand back the SPA shell and let
    # React Router resolve it, so a deep link like /orders/3 survives a full
    # page load rather than 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location @php {
        include fastcgi_params;

        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Set here, not forwarded from the request. Whatever a client sent
        # under these names is discarded and replaced with what this server
        # actually knows: $remote_addr is the address cloudflare-ips.conf
        # recovered, and the scheme is https because this block only exists
        # inside the TLS server.
        #
        # That is what makes trusting every proxy safe in bootstrap/app.php.
        # Laravel is reading a header PHP can only have received from nginx,
        # because PHP-FPM's port is never published outside the compose
        # network. These lines come after the include on purpose: duplicates
        # are resolved last-one-wins.
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_PORT 443;

        # The gear adviser calls Claude while the request is open and may
        # take several tool rounds to answer, which makes it slower than
        # anything else here by a wide margin. The 60s default cuts it off
        # mid-answer, so this is sized for that worst case rather than for
        # the typical page.
        fastcgi_read_timeout 180s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
