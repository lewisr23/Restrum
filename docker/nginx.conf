server {
    listen 80;
    server_name _;

    # The SPA is the site root; Laravel is mounted underneath it at the paths
    # below. Keeping the two roots separate avoids index.html and index.php
    # competing to answer "/".
    root /var/www/frontend;
    index index.html;

    client_max_body_size 25M;

    # Uploaded media comes straight off Laravel's public disk, never through
    # PHP. This aliases the shared storage volume directly rather than going
    # via the public/storage symlink, so nginx needs no copy of the PHP tree.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    location /api/ {
        try_files $uri @php;
    }

    # Echo posts here to authorize private channel subscriptions.
    location /broadcasting/ {
        try_files $uri @php;
    }

    location = /up {
        try_files $uri @php;
    }

    # Anything else is a client-side route: hand back the SPA shell and let
    # React Router resolve it, so a deep link like /messages/3 survives a
    # full page load rather than 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location @php {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 60s;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
