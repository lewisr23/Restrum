<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Two icons on purpose. The SVG is what modern browsers use and it
         stays sharp on any display; the .ico is the fallback, and it holds
         sizes from 16 up to 256 because Windows and older browsers each
         pick a different one out of the file. Both are generated from the
         same geometry as the LogoMark component, by
         scripts/generate-brand-assets.py. -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" href="%PUBLIC_URL%/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#141414" />
    <meta
      name="description"
      content="Restrum, the UK marketplace for secondhand instruments and gear. Real condition history, fair price context, community-verified sellers."
    />

    <!-- What a link to the site unfurls into on LinkedIn, X, Facebook,
         Slack and anywhere else that reads Open Graph. Without these a
         shared link renders as a grey box with a bare URL under it.
         The image URL has to be absolute: a scraper resolves it from its
         own server, not from the page it found it on. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Restrum" />
    <meta property="og:url" content="https://restrum.uk/" />
    <meta property="og:title" content="Restrum: UK Secondhand Instrument Marketplace" />
    <meta
      property="og:description"
      content="Buy and sell secondhand instruments and gear with the money held safely until it arrives. Real condition history, fair price context, verified sellers."
    />
    <meta property="og:image" content="https://restrum.uk/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Restrum, the UK marketplace for secondhand instruments and gear" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Restrum: UK Secondhand Instrument Marketplace" />
    <meta
      name="twitter:description"
      content="Buy and sell secondhand instruments and gear with the money held safely until it arrives."
    />
    <meta name="twitter:image" content="https://restrum.uk/og-image.png" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Two families, three roles. Archivo is a variable grotesque with a width
      axis, so the condensed wordmark and the extended bold text are the same
      typeface at two widths rather than two unrelated faces that have to be
      made to get along. Source Serif carries the reading text.

      These stand in for Placard, Venus Extended and Century Expanded, which
      are licensed Monotype and Linotype faces and cannot be served from a
      free CDN. Swapping any of them for the real thing is an @font-face
      block and one line in abstracts/_variables.scss.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Source+Serif+4:opsz,wght@8..60,400..600&display=swap"
      rel="stylesheet"
    />
    <!--
      The theme has to be on <html> before the first paint, or a visitor who
      chose light gets a flash of the dark page while the bundle downloads.
      That is the one thing a stylesheet cannot do for itself, so it is four
      lines of inline script rather than a component: by the time React runs,
      ThemeContext has already agreed with what is on screen.

      No stored choice means no attribute, which leaves the page following
      prefers-color-scheme through the media query in base/_tokens.scss.
    -->
    <script>
      try {
        var saved = localStorage.getItem('restrum.theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) {
        /* Site data blocked. The media query still applies. */
      }
    </script>
    <title>Restrum: UK Secondhand Instrument Marketplace</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
